<section class="profile">
	<div class="profile__card">
		<ngx-file
			mode="single-image"
			view="thumb-only"
			[wImage]="userService.thumb()"
			(wImageChange)="updateThumb($event || '')"
			[container]="'user'"
			[name]="userService.user()._id + '.jpg'"
			[accept]="'image/*'"
			[clearable]="false"
			[preview]="true"
			[cropWidth]="512"
			[cropHeight]="512"
		></ngx-file>

		<form (submit)="wFormSubmit(); $event.preventDefault()" class="profile__form">
			<winput type="text" wClass="w-full" [label]="translateService.translate('Name')()" [placeholder]="translateService.translate('Enter your name...')()" [formField]="profileForm.name" />
			<winput type="tel" wClass="w-full" [label]="translateService.translate('Phone')()" [placeholder]="translateService.translate('Enter your phone...')()" [formField]="profileForm.phone" />
			<winput type="textarea" wClass="w-full" [label]="translateService.translate('Bio')()" [placeholder]="translateService.translate('Enter your bio...')()" [formField]="profileForm.bio" />

			<div class="profile__actions">
				<button wbutton [disabled]="isSubmitDisabled()"><span translate>Update</span></button>
			</div>
		</form>
	</div>

	<button type="button" class="profile__logout" (click)="userService.logout()">
		<i class="pi pi-sign-out"></i>
		<span translate>Logout</span>
	</button>
</section>
