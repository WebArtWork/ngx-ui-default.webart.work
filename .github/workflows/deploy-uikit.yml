name: Deploy uikit to GitHub Pages

on:
    push:
        branches:
            - master

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'

            - name: Install dependencies
              run: npm ci

            - name: Rebuild lightningcss
              run: npm rebuild lightningcss

            - name: Build uikit
              run: npm run build:uikit

            - name: Add CNAME file
              run: echo "ngx-ui-default-uikit.webart.work" > dist/uikit/browser/CNAME

            - name: Add SPA fallback for GitHub Pages route reload
              run: cp dist/uikit/browser/index.html dist/uikit/browser/404.html

            - name: Set up SSH
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan github.com >> ~/.ssh/known_hosts

            - name: Commit and push to gh-pages using SSH
              env:
                  GIT_SSH_COMMAND: 'ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no'
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  cd dist/uikit/browser
                  git init  # Initialize a new git repository
                  git add --all .  # Add all changes
                  git commit -m "Deploy uikit to GitHub Pages"
                  git checkout -B gh-pages  # Switch to gh-pages branch
                  git push git@github.com:WebArtWork/ngx-ui-default-uikit.webart.work.git gh-pages --force

            - name: Clean up SSH
              run: |
                  rm -f ~/.ssh/id_rsa
                  rm -f ~/.ssh/known_hosts
