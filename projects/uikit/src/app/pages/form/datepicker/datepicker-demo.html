<h1 class="demo-page__title">DatePicker</h1>

<p class="demo-page__note">
	ngx-ui's <code>Input</code> uses the browser's native <code>type="date"</code> picker — no
	built-in date range selection.
</p>

<section class="demo-section">
	<h2 class="demo-section__title">Basic</h2>
	<winput type="date" label="Date" [(wModel)]="date" />
</section>

<section class="demo-section">
	<h2 class="demo-section__title">Disabled</h2>
	<winput type="date" [disabled]="true" />
</section>
