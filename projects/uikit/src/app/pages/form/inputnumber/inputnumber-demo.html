<h1 class="demo-page__title">InputNumber</h1>

<p class="demo-page__note">
	ngx-ui's <code>Input</code> uses the native <code>type="number"</code> input — no built-in
	currency formatting or stepper buttons.
</p>

<section class="demo-section">
	<h2 class="demo-section__title">Basic</h2>
	<winput type="number" label="Quantity" [(wModel)]="value" />
</section>

<section class="demo-section">
	<h2 class="demo-section__title">Disabled</h2>
	<winput type="number" [disabled]="true" placeholder="Disabled" />
</section>
