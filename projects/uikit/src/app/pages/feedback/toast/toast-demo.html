<h1 class="demo-page__title">Toast</h1>

<p class="demo-page__note">
	ngx-ui's toast equivalent is <code>AlertService</code> — it mounts its own wrapper into the
	DOM, no template component required.
</p>

<section class="demo-section">
	<h2 class="demo-section__title">Types</h2>
	<div class="demo-section__row">
		<button wbutton type="success" (wClick)="show('success')">Success</button>
		<button wbutton type="info" (wClick)="show('info')">Info</button>
		<button wbutton type="warning" (wClick)="show('warning')">Warning</button>
		<button wbutton type="danger" (wClick)="show('error')">Error</button>
	</div>
</section>
