<div class="settings">
	<h1>Settings</h1>

	<wcard>
		<wtabs [(activeIndex)]="activeIndex">
			<wtab header="Profile">
				<div class="settings__form">
					<label class="settings__field">
						<span>Name</span>
						<winput [(wModel)]="name" />
					</label>
					<label class="settings__field">
						<span>Email</span>
						<winput [type]="'email'" [(wModel)]="email" />
					</label>
					<div class="settings__actions">
						<button wbutton [type]="'primary'" [icon]="'check'">Save Changes</button>
					</div>
				</div>
			</wtab>
			<wtab header="Security">
				<div class="settings__form">
					<label class="settings__field">
						<span>Current Password</span>
						<winput [type]="'password'" [(wModel)]="currentPassword" />
					</label>
					<label class="settings__field">
						<span>New Password</span>
						<winput [type]="'password'" [(wModel)]="newPassword" />
					</label>
					<div class="settings__actions">
						<button wbutton [type]="'primary'" [icon]="'lock'">Update Password</button>
					</div>
				</div>
			</wtab>
			<wtab header="Notifications">
				<div class="settings__form">
					<label class="settings__field settings__field--inline">
						<span>Email Notifications</span>
						<winput [type]="'checkbox'" [(wModel)]="emailNotifications" />
					</label>
					<label class="settings__field settings__field--inline">
						<span>Push Notifications</span>
						<winput [type]="'checkbox'" [(wModel)]="pushNotifications" />
					</label>
					<label class="settings__field settings__field--inline">
						<span>Weekly Digest</span>
						<winput [type]="'checkbox'" [(wModel)]="weeklyDigest" />
					</label>
				</div>
			</wtab>
		</wtabs>
	</wcard>
</div>
